<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 279" width="100%" height="100%">
  <defs>
<!--Cyan/Blue Ambient Glow Filter-->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
<!--Electric Blue Primary Gradient-->
    <linearGradient id="electricBlue" x1="1800" y1="2200" x2="3300" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
<!--Specular Highlight Gradient-->
    <linearGradient id="topHighlight" x1="2500" y1="2200" x2="2500" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#bae6fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
<!--Radial Backdrop Glow-->
    <radialGradient id="backdropGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
<!--Unified Logo Path Geometry-->
    <g id="volten-paths">
      <path d="M1976 1953 c54 -103 123 -236 154 -294 l55 -106 55 37 c30 21 83 67 117 102 l62 63 -87 170 c-57 111 -97 176 -115 190 -25 18 -46 20 -184 23 l-155 4 98 -189z"/>
