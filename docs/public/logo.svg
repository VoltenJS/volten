  </defs>
  <g transform="translate(0, 279) scale(0.1, -0.1)">
<!--2. Electric Blue Core Body with Crisp Edge Stroke-->
    <use href="#volten-paths" fill="url(#electricBlue)" stroke="#7dd3fc" stroke-width="14" stroke-linejoin="round"/>
